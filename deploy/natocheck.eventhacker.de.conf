# Enable the HTTP host first for ACME; enable HTTPS only after issuing its certificate.
<VirtualHost *:80>
    ServerName natocheck.eventhacker.de
    DocumentRoot /var/www/letsencrypt
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    RedirectMatch 301 ^/(?!\.well-known/acme-challenge/)(.*)$ https://natocheck.eventhacker.de/$1
</VirtualHost>

<VirtualHost *:443>
    ServerName natocheck.eventhacker.de
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/natocheck.eventhacker.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/natocheck.eventhacker.de/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 330
    LimitRequestBody 2000000
    # Reject declared oversized bodies before mod_proxy forwards any upload.
    RewriteEngine On
    RewriteCond expr "req('Content-Length') -gt 2000000"
    RewriteRule ^ - [R=413,L]
    ProxyPass / http://127.0.0.1:8767/
    ProxyPassReverse / http://127.0.0.1:8767/
    Header always set Permissions-Policy "microphone=(self)"
    ErrorLog ${APACHE_LOG_DIR}/natocheck-error.log
    CustomLog ${APACHE_LOG_DIR}/natocheck-access.log combined
</VirtualHost>
